name: Reusable Dependabot approval and auto-merge

on:
  workflow_call:
    inputs:
      pr-number:
        description: Pull request associated with the successful workflow run
        required: true
        type: number
      head-sha:
        description: Commit SHA validated by the successful workflow run
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  approve-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Approve and enable auto-merge for the validated Dependabot PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          VALIDATED_HEAD_SHA: ${{ inputs.head-sha }}
        run: |
          set -euo pipefail

          pr_number="$PR_NUMBER"
          author="$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
              --jq '.user.login'
          )"

          if [[ "$author" != "dependabot[bot]" ]]; then
            echo "Pull request #${pr_number} is not owned by Dependabot."
            exit 0
          fi

          state="$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
              --jq '.state'
          )"
          if [[ "$state" != "open" ]]; then
            echo "Dependabot pull request #${pr_number} is no longer open."
            exit 0
          fi

          default_branch="$(
            gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch'
          )"
          base_ref="$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
              --jq '.base.ref'
          )"
          if [[ "$base_ref" != "$default_branch" ]]; then
            echo "Dependabot pull request #${pr_number} does not target the default branch."
            exit 0
          fi

          current_head_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
              --jq '.head.sha'
          )"
          if [[ "$current_head_sha" != "$VALIDATED_HEAD_SHA" ]]; then
            echo "Dependabot pull request #${pr_number} changed after the successful run."
            exit 0
          fi

          already_approved="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/reviews" \
              --jq 'any(.[]; .user.login == "github-actions[bot]" and .state == "APPROVED")'
          )"
          if [[ "$already_approved" != "true" ]]; then
            if ! gh pr review "$pr_number" --repo "$GITHUB_REPOSITORY" --approve; then
              echo "::warning::GitHub Actions approval is disabled by an organization or enterprise policy; continuing with auto-merge."
            fi
          fi

          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" \
            --auto --squash --delete-branch
